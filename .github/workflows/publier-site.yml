# Publication de Kinshasa 3D (carte + mode jeu) sur GitHub Pages.
# Site 100 % statique : le dossier web/kinshasa est publié tel quel.
# Prérequis (une seule fois) : Settings > Pages > Source : « GitHub Actions ».
name: Publier le site web

on:
  push:
    branches: [claude/funny-dijkstra-biuctf]
    paths: ["web/kinshasa/**", ".github/workflows/publier-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url || steps.deploiement2.outputs.page_url || steps.deploiement3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # La carte (.pmtiles), le relief (.png) et les personnages (.gltf/.glb) sont dans Git LFS.
      # Cache : évite de retélécharger ~90 Mo à chaque publication (quota LFS gratuit limité).
      - name: Liste des fichiers LFS
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-ids
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-
      - name: Récupérer les fichiers LFS
        run: git lfs pull && git lfs checkout
      - name: Préparer le dossier publié (sans les tests ni les fichiers Node)
        run: |
          mkdir -p _site
          cp -r web/kinshasa/. _site/
          rm -rf _site/jeu/tests _site/jeu/node_modules _site/jeu/package.json _site/jeu/package-lock.json
          du -sh _site
          # Vérification : aucun fichier ne doit être resté un simple pointeur LFS.
          if grep -rl --include='*.pmtiles' --include='*.png' --include='*.gltf' --include='*.glb' '^version https://git-lfs' _site; then
            echo "Fichiers LFS non récupérés" && exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # L'artefact peut mettre quelques secondes à devenir visible pour le déploiement
      # (« No artifacts named github-pages were found ») : 2e essai après 30 s, puis 3e après 90 s.
      - id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploiement.outcome == 'failure'
        run: sleep 30
      - id: deploiement2
        if: steps.deploiement.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.deploiement.outcome == 'failure' && steps.deploiement2.outcome == 'failure'
        run: sleep 90
      - id: deploiement3
        if: steps.deploiement.outcome == 'failure' && steps.deploiement2.outcome == 'failure'
        uses: actions/deploy-pages@v4
