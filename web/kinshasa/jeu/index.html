<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Kinshasa 3D — mode jeu</title>
  <meta name="description" content="Explorer Limete, la Gombe, Lingwala, Kasa-Vubu et Kalamu (Kinshasa) à pied et en véhicule, sur la vraie carte.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="jeu.css">
  <link rel="stylesheet" href="ihm.css">
  <!-- Installation comme application (écran d'accueil) : ouverture en plein écran, à l'horizontale. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0c0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="assets/icones/icone-192.png">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"
    }
  }
  </script>
</head>
<body>
  <div id="jeu"></div>

  <div id="chargement">
    <h1>Kinshasa 3D</h1>
    <p id="chargement-zone">Zone jouable : données réelles</p>
    <div class="barre"><div id="chargement-barre"></div></div>
    <p id="chargement-texte">Démarrage…</p>
  </div>

  <!-- Interface de jeu (HUD) : chaque élément affiche une vraie valeur du jeu. -->
  <div id="ihm">
    <div id="notifs" aria-live="polite"></div>
    <div id="gps-bandeau" hidden></div>
    <div id="haut-droite">
      <div id="argent">--</div>
      <div id="heure">--:--</div>
      <div id="mission-chrono" hidden></div>
    </div>
    <button id="btn-menu" title="Menu pause (Échap)" aria-label="Menu pause">☰</button>
    <div id="radar">
      <canvas id="minicarte"></canvas>
      <div class="zoom">
        <button data-zoom="+" title="Zoom avant (=)">+</button>
        <button data-zoom="-" title="Zoom arrière (-)">−</button>
        <button data-zoom="carte" title="Grande carte (M)">⤢</button>
      </div>
      <div class="barres">
        <div class="jauge sante" title="Santé"><b id="barre-sante"></b></div>
        <div class="jauge endurance" title="Endurance"><b id="barre-endurance"></b></div>
      </div>
      <div id="rue"></div>
    </div>
    <div id="objectif" hidden></div>
    <div id="interactions" hidden><ul></ul></div>
    <div id="tableau-bord" hidden>
      <div class="tb-ligne"><span id="tb-vitesse">0</span><span class="tb-unite">km/h</span><span id="tb-rapport">P</span></div>
      <div id="tb-nom"></div>
      <div class="tb-jauge" title="Carburant"><i>⛽</i><div class="jauge carbu"><b id="tb-carburant"></b></div></div>
      <div class="tb-jauge" title="État mécanique"><i>🔧</i><div class="jauge meca"><b id="tb-etat"></b></div></div>
      <div class="tb-bas">
        <span id="tb-odo" title="Compteur kilométrique">—</span>
        <span class="voyants">
          <i id="v-phares" title="Phares">💡</i><i id="v-frein" title="Frein à main">Ⓟ</i><i id="v-carbu" title="Réserve de carburant">⛽</i><i id="v-moteur" title="Moteur endommagé">⚠</i><i id="v-sirene" title="Sirène">🚨</i>
        </span>
      </div>
      <div id="tb-action" hidden></div>
    </div>
  </div>

  <!-- Menu pause -->
  <div id="menu" hidden>
    <div class="menu-fond"></div>
    <div class="menu-cadre">
      <header class="menu-tete">
        <div><h1>MBOKA ELENGI</h1><p id="menu-sous-titre">Kinshasa 3D</p></div>
        <div id="menu-infos"></div>
      </header>
      <nav class="menu-onglets" role="tablist">
        <button data-onglet="reprendre">▶ Reprendre</button>
        <button data-onglet="carte">Carte</button>
        <button data-onglet="personnage">Personnage</button>
        <button data-onglet="vehicules">Véhicules</button>
        <button data-onglet="missions">Missions</button>
        <button data-onglet="transports">Transports</button>
        <button data-onglet="zones">Zones</button>
        <button data-onglet="parametres">Paramètres</button>
        <button data-onglet="sauvegarde">Sauvegarde</button>
        <button data-onglet="quitter">Quitter</button>
      </nav>
      <section id="menu-contenu"></section>
      <footer class="menu-pied" id="menu-pied"></footer>
    </div>
  </div>
  <div id="panneau-perso" class="panneau" hidden></div>
  <div id="panneau-transports" class="panneau" hidden></div>
  <div id="panneau-zones" class="panneau" hidden></div>
  <p id="attribution" class="note" hidden></p>

  <!-- Commandes tactiles (téléphone) : boutons différents à pied et en véhicule, disposition modifiable. -->
  <div id="tactile" hidden>
    <div class="joy" data-id="joy"><i></i></div>
    <div class="boutons">
      <button data-id="vehicule" data-action="vehicule" class="t-tous">F<small>véhicule</small></button>
      <button data-id="interagir" data-action="interagir" class="t-pied">E<small>agir</small></button>
      <button data-id="sauter" data-action="sauter" class="t-pied">⤒<small>saut</small></button>
      <button data-id="courir" data-bascule="courir" class="t-pied">»<small>courir</small></button>
      <button data-id="accroupir" data-action="accroupir" class="t-pied">⤓<small>accroupi</small></button>
      <button data-id="gaz" data-tenir="gaz" class="t-vehicule pedale">▲<small>accélérer</small></button>
      <button data-id="frein" data-tenir="frein" class="t-vehicule pedale">▼<small>frein</small></button>
      <button data-id="klaxon" data-action="klaxon" class="t-vehicule">📯<small>klaxon</small></button>
      <button data-id="phares" data-action="phares" class="t-vehicule">💡<small>phares</small></button>
      <button data-id="actionVehicule" data-action="actionVehicule" class="t-vehicule">R<small>action</small></button>
      <button data-id="camera" data-action="camera" class="t-tous">◎<small>caméra</small></button>
      <button data-id="pleinEcran" data-action="pleinEcran" class="t-tous" title="Plein écran à l'horizontale">⛶<small>écran</small></button>
    </div>
  </div>
  <div id="tourner" hidden>
    <span>↻ Tournez le téléphone : le jeu se joue mieux à l'horizontale.</span>
    <div class="actions-tourner"><button data-plein-ecran>Plein écran</button><button class="fermer" aria-label="Fermer">✕</button></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
