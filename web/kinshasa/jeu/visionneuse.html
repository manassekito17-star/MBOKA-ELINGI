<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bâtiments remarquables — Kinshasa 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --fond: #101214; --panneau: rgba(16, 18, 20, 0.86); --texte: #f2f2ee; --ocre: #f2b233; --bord: rgba(255,255,255,0.14); }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--fond); color: var(--texte); font-family: "Barlow Semi Condensed", system-ui, sans-serif; overflow: hidden; }
    #vue { position: fixed; inset: 0; }
    #panneau { position: fixed; left: 16px; top: 16px; width: min(380px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto;
      background: var(--panneau); border: 1px solid var(--bord); border-radius: 14px; padding: 14px 16px; }
    h1 { margin: 0; font-size: 26px; letter-spacing: .02em; color: var(--ocre); }
    .sous { opacity: .8; margin: 2px 0 10px; }
    select, button { font: inherit; color: var(--texte); background: #24282c; border: 1px solid var(--bord); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    button.actif { background: var(--ocre); color: #111; border-color: var(--ocre); }
    .rang { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .fid { font-size: 14px; line-height: 1.35; }
    .fid li { margin: 2px 0; }
    .tag { display: inline-block; padding: 0 6px; border-radius: 6px; font-size: 12px; font-weight: 700; margin-right: 4px; }
    .photo { background: #2f7d32; } .osm { background: #2a5db0; } .satellite { background: #6a4fb0; } .estime, .deduit { background: #8a5a12; } .absent { background: #8a1f1f; }
    #ref { position: fixed; right: 16px; bottom: 16px; width: min(46vw, 640px); border: 1px solid var(--bord); border-radius: 10px; overflow: hidden; display: none; background: #000; }
    #ref img { width: 100%; display: block; }
    #ref div { font-size: 12px; padding: 4px 8px; background: var(--panneau); }
    a { color: #9cc7ff; }
    @media (max-width: 700px) { #ref { width: calc(100vw - 32px); } #panneau { max-height: 45vh; } }
  </style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="vue"></div>
  <div id="panneau">
    <h1 id="nom">…</h1>
    <div class="sous" id="sous"></div>
    <select id="choix"></select>
    <div class="rang" id="vues"></div>
    <div class="rang" id="lods"></div>
    <div id="infos" class="fid"></div>
  </div>
  <div id="ref"><img alt="Photo de référence"><div></div></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const params = new URLSearchParams(location.search);
if (params.has("capture")) document.head.insertAdjacentHTML("beforeend", "<style>#panneau,#ref{display:none!important}</style>");
const registre = await (await fetch("donnees/batiments.json")).json();
const liste = registre.batiments.filter((b) => b.modele);
const $ = (id) => document.getElementById(id);

const rendu = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
rendu.setPixelRatio(Math.min(2, devicePixelRatio));
rendu.setSize(innerWidth, innerHeight);
rendu.toneMapping = THREE.ACESFilmicToneMapping;
rendu.toneMappingExposure = 1.05;
rendu.shadowMap.enabled = true;
$("vue").appendChild(rendu.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9d3db);
scene.fog = new THREE.Fog(0xc9d3db, 600, 2200);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 5000);
const ctl = new OrbitControls(camera, rendu.domElement);
scene.add(new THREE.HemisphereLight(0xe8eef5, 0x6b6250, 1.3));
const soleil = new THREE.DirectionalLight(0xfff3e0, 2.2);
soleil.position.set(-180, 260, 140);
soleil.castShadow = true;
Object.assign(soleil.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, far: 1200 });
soleil.shadow.mapSize.set(4096, 4096);
scene.add(soleil);
const sol = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshStandardMaterial({ color: 0x9c8f78, roughness: 1 }));
sol.rotation.x = -Math.PI / 2; sol.position.y = -0.02; sol.receiveShadow = true;
scene.add(sol);

let modele = null, courant = null, lodForce = null;
const chargeur = new GLTFLoader();

function niveau(n) {
  lodForce = n;
  for (const k of ["LOD0", "LOD1", "LOD2"]) { const o = modele?.getObjectByName(k); if (o) o.visible = n === null ? k === "LOD0" : k === n; }
  for (const b of $("lods").children) b.classList.toggle("actif", b.dataset.n === String(n));
}

function vue(nom) {
  const v = courant.vues[nom];
  if (!v) return;
  camera.position.set(...v.pos);
  ctl.target.set(...v.cible);
  camera.fov = v.fov || 45;
  camera.updateProjectionMatrix();
  ctl.update();
  const r = $("ref");
  if (v.photo) {
    const p = registre.photos.find((x) => x.id === v.photo);
    r.style.display = "block";
    r.querySelector("img").src = p.fichier;
    r.querySelector("div").innerHTML = `Référence : <a href="${p.page}" target="_blank" rel="noopener">${p.auteur}</a>, ${p.licence}, ${p.date}`;
  } else r.style.display = "none";
  for (const b of $("vues").children) b.classList.toggle("actif", b.dataset.v === nom);
}

async function ouvrir(id) {
  courant = liste.find((b) => b.id === id) || liste[0];
  $("nom").textContent = courant.nom_courant;
  $("sous").textContent = `${courant.categorie_libelle} · ${courant.commune}, Kinshasa · ${courant.gps.lat.toFixed(5)}, ${courant.gps.lon.toFixed(5)}`;
  if (modele) scene.remove(modele);
  const g = await chargeur.loadAsync(courant.modele + "?v=" + (courant.version || 1));
  modele = g.scene;
  modele.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  const col = modele.getObjectByName("COLLISION"); if (col) col.visible = false;
  scene.add(modele);
  $("vues").innerHTML = Object.keys(courant.vues).map((k) => `<button data-v="${k}">${courant.vues[k].nom}</button>`).join("");
  $("lods").innerHTML = ["LOD0", "LOD1", "LOD2"].map((k) => `<button data-n="${k}">${k}</button>`).join("");
  const f = courant.fidelite;
  $("infos").innerHTML = `<p>${courant.description}</p><p><b>Fidélité : ${f.niveau}</b> — ${f.resume}</p><ul>` +
    f.elements.map((e) => `<li><span class="tag ${e.statut}">${e.statut}</span>${e.element}</li>`).join("") + "</ul>";
  niveau(params.get("lod") || "LOD0");
  vue(params.get("vue") || Object.keys(courant.vues)[0]);
  document.title = `${courant.nom_courant} — Kinshasa 3D`;
  window.__pret = true;
}

$("choix").innerHTML = liste.map((b) => `<option value="${b.id}">${b.nom_courant}</option>`).join("");
$("choix").onchange = (e) => { window.__pret = false; ouvrir(e.target.value); };
$("vues").onclick = (e) => { const b = e.target.closest("[data-v]"); if (b) vue(b.dataset.v); };
$("lods").onclick = (e) => { const b = e.target.closest("[data-n]"); if (b) niveau(b.dataset.n); };
addEventListener("resize", () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); rendu.setSize(innerWidth, innerHeight); });
if (params.get("id")) $("choix").value = params.get("id");
window.__vue = vue; window.__niveau = niveau; window.__camera = camera; window.__ctl = ctl;
await ouvrir(params.get("id") || liste[0].id);
(function boucle() { requestAnimationFrame(boucle); rendu.render(scene, camera); })();
</script>
</body>
</html>
